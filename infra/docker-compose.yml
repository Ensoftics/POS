# Local development services. Ports are offset from defaults to avoid clashing
# with other projects on the same machine.
name: ensoftic-pos

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      # Superuser used only for migrations and test cleanup. The API connects as
      # the restricted `pos_app` role (created in init/01-roles.sh) so that
      # PostgreSQL row-level security policies are enforced.
      POSTGRES_USER: pos_owner
      POSTGRES_PASSWORD: pos_owner_dev
      POSTGRES_DB: pos_dev
      POS_APP_PASSWORD: pos_app_dev
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pos_owner -d pos_dev']
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    # Captures outgoing email (password resets) in development. UI at http://localhost:8026
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:1026:1025'
      - '127.0.0.1:8026:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 20

  storage:
    # S3-compatible object storage for product images (SeaweedFS). Production uses any
    # S3-compatible service (AWS S3, Cloudflare R2, ...) via the S3_* settings.
    image: chrislusf/seaweedfs:3.97
    command: >
      server -dir=/data -ip=127.0.0.1 -ip.bind=0.0.0.0 -s3 -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json -volume.max=0 -master.volumeSizeLimitMB=64
    ports:
      - '127.0.0.1:8334:8333'
    volumes:
      - storage-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    # Reserved for BullMQ background jobs and distributed rate limiting (later slices).
    # Start with: docker compose -f infra/docker-compose.yml --profile jobs up -d
    image: redis:7.4-alpine
    profiles: ['jobs']
    ports:
      - '127.0.0.1:6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pg-data:
  storage-data:
